experiment: figure4
protocol: cumulative-trajectory-rmse-v1-budget3000
artifact_namespace: cumulative_rmse_std_hopper_2seeds_3000epochs
tasks:
  - hopper-medium-replay-v2
seeds: [0, 1]
device: cuda:0
model:
  hidden_dim: 200
  max_backtrack: 5
  ensemble_size: 7
  elite_size: 5
policy:
  hidden_dims: [256, 256]
  actor_lr: 0.0001
  critic_lr: 0.0003
  model_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  rollout_horizon: 5
  rollout_frequency: 1000
  rollout_batch_size: 50000
  rollout_chunk_size: 4096
  model_retain_epochs: 5
  real_ratio: 0.5
  penalty: 0.1
  # Reduced reproduction budget. Keep the original 5000-epoch cosine schedule
  # so resuming the completed 1250 epochs preserves the exact optimization path.
  epochs: 3000
  scheduler_epochs: 5000
  steps_per_epoch: 1000
  batch_size: 256
  checkpoint_interval: 250
  eval_interval: 50
  eval_episodes: 10
  alpha:
    hopper-medium-replay-v2: 0.05
evaluation:
  starts: 100
  rollout_horizon: 5
  points_per_policy: 500
  inference_chunk: 4096
  policies: [random, learned, dataset]
  dataset_diagnostic_points: 500
  sampling_seed: 202405
  max_collection_attempts: 20
parallel:
  max_workers: 2
phase_overrides:
  smoke:
    seeds: [0]
    policy:
      rollout_batch_size: 64
      rollout_chunk_size: 32
      epochs: 1
      scheduler_epochs: 1
      steps_per_epoch: 10
      checkpoint_interval: 1
      eval_interval: 1
      eval_episodes: 1
    evaluation:
      starts: 8
      rollout_horizon: 2
      points_per_policy: 16
      dataset_diagnostic_points: 16
  pilot:
    seeds: [0]

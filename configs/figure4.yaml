experiment: figure4
tasks:
  - hopper-medium-replay-v2
  - walker2d-medium-replay-v2
seeds: [0, 1, 2, 3, 4]
device: cuda:0
model:
  hidden_dim: 200
  max_backtrack: 5
  ensemble_size: 7
  elite_size: 5
policy:
  hidden_dims: [256, 256]
  actor_lr: 0.0001
  critic_lr: 0.0003
  model_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  rollout_horizon: 5
  rollout_frequency: 1000
  rollout_batch_size: 50000
  rollout_chunk_size: 4096
  model_retain_epochs: 5
  real_ratio: 0.5
  penalty: 0.1
  epochs: 5000
  steps_per_epoch: 1000
  batch_size: 256
  checkpoint_interval: 250
  eval_interval: 50
  eval_episodes: 10
  alpha:
    hopper-medium-replay-v2: 0.05
    walker2d-medium-replay-v2: 0.1
evaluation:
  starts: 100
  rollout_horizon: 5
  points_per_policy: 500
  inference_chunk: 4096
  policies: [random, learned, behavior]
  dataset_diagnostic_points: 500
phase_overrides:
  smoke:
    policy:
      rollout_batch_size: 64
      rollout_chunk_size: 32
      epochs: 1
      steps_per_epoch: 10
      checkpoint_interval: 1
      eval_interval: 1
      eval_episodes: 1
    evaluation:
      starts: 8
      rollout_horizon: 2
      points_per_policy: 16
      dataset_diagnostic_points: 16
  pilot:
    tasks: [hopper-medium-replay-v2]
    seeds: [0]
